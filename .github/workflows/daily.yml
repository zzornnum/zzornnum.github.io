name: Daily market data

on:
  schedule:
    # KST 06:40 매일 — 07:30 뉴스 브리핑 전에 전날 시장 지표를 저장
    - cron: "40 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_daily.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily
          git diff --cached --quiet && exit 0
          git commit -m "시장 지표: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push
