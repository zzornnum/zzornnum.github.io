name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 평일 KST 08:00–20:00 30분마다 (NXT 장전·정규장·장후 포함) + 마감 직후 20:10
    - cron: "*/30 23 * * 0-4"
    - cron: "*/30 0-10 * * 1-5"
    - cron: "0,10 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 이벤트가 늦게 도착해도 항상 최신 main을 배포 (오래된 커밋이 덮어쓰지 않도록)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 뉴스 헤드라인에 기사 원문 링크를 찾아 붙이고 저장소에 커밋 (GITHUB_TOKEN 푸시는 배포를 다시 트리거하지 않음)
      - name: Link news headlines to articles
        run: |
          python scripts/resolve_news_urls.py
          git diff --quiet data/news && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news
          git commit -m "뉴스 기사 링크 연결"
          git pull --rebase && git push || echo "push failed; links still deployed this run"
      - name: Fetch KOSPI/KOSDAQ prices
        run: python scripts/fetch_market.py data/market.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
