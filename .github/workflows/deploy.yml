name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 평일 KST 08:00–20:00 30분마다 (NXT 장전·정규장·장후 포함) + 마감 직후 20:10
    - cron: "*/30 23 * * 0-4"
    - cron: "*/30 0-10 * * 1-5"
    - cron: "0,10 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch KOSPI/KOSDAQ prices
        run: python scripts/fetch_market.py data/market.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
