name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 장중 30분마다 (KST 09:00–15:30, 평일) + 장 마감 후 16:10
    - cron: "*/30 0-6 * * 1-5"
    - cron: "10 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch KOSPI/KOSDAQ prices
        run: python scripts/fetch_market.py data/market.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
